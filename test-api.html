<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tes API LabCare</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 20px; background: #f1f5f9; color: #1e293b; }
h1 { font-size: 20px; margin-bottom: 8px; }
.card { background: #fff; padding: 16px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
button { padding: 14px 20px; font-size: 15px; border-radius: 10px; border: none; background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 8px; }
button:hover { background: #1d4ed8; }
button.red { background: #dc2626; }
button.red:hover { background: #b91c1c; }
button.green { background: #16a34a; }
.result { background: #0f172a; color: #4ade80; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 11px; white-space: pre-wrap; word-break: break-all; min-height: 80px; max-height: 500px; overflow-y: auto; }
.result.err { color: #f87171; }
.result.loading { color: #fbbf24; }
.info { font-size: 12px; color: #64748b; margin-top: 8px; }
</style>
</head>
<body>

<h1>🔍 Tes API LabCare</h1>

<div class="card">
  <button onclick="testGetAll()">1. Tes getAll (semua data)</button>
  <button onclick="testProgram()">2. Cek Data Program</button>
  <button class="green" onclick="testSaveProgram()">3. ⚠️ TES SIMPAN PROGRAM</button>
  <button class="red" onclick="testClearProgram()">4. Hapus Semua Program</button>
</div>

<div class="card">
  <h3 style="font-size:14px;margin-bottom:8px;">Hasil:</h3>
  <div id="result" class="result">Klik tombol di atas.</div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbzvDFJuyrswvUIsS7Jw-OxfQTjf_8AU4SGj9c5a_9UB8MSrE3dfxRERz7XllhlwIDT_/exec';

function show(msg, isErr) {
  var el = document.getElementById('result');
  el.textContent = msg;
  el.className = 'result' + (isErr ? ' err' : '');
}
function showLoading(m) {
  var el = document.getElementById('result');
  el.textContent = m;
  el.className = 'result loading';
}

async function callAPI(action, data) {
  showLoading('⏳ Mengirim ' + action + '...');
  try {
    var res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, data: data || {} }),
      redirect: 'follow'
    });
    var text = await res.text();
    try {
      return JSON.parse(text);
    } catch (e) {
      show('❌ Response bukan JSON:\n\n' + text, true);
      return null;
    }
  } catch (e) {
    show('❌ Fetch error: ' + e.message, true);
    return null;
  }
}

async function testGetAll() {
  var r = await callAPI('getAll');
  if (!r) return;
  if (!r.ok) { show('❌ API error: ' + r.error, true); return; }
  show('✅ getAll BERHASIL!\n\n' +
    '- Pasien     : ' + (r.pasien ? r.pasien.length : 0) + '\n' +
    '- Pemeriksaan: ' + (r.pemeriksaan ? r.pemeriksaan.length : 0) + '\n' +
    '- Analis     : ' + (r.analis ? r.analis.length : 0) + '\n' +
    '- Dokter     : ' + (r.dokter ? r.dokter.length : 0) + '\n' +
    '- Program    : ' + (r.program ? r.program.length : 0) + '\n' +
    '- Kegiatan   : ' + (r.kegiatan ? r.kegiatan.length : 'undefined') + '\n' +
    '- Peserta    : ' + (r.peserta ? r.peserta.length : 'undefined');
}

async function testProgram() {
  var r = await callAPI('getAll');
  if (!r) return;
  if (r.program === undefined) { show('❌ Sheet "Program" TIDAK KEBACA', true); return; }
  if (r.program.length === 0) { show('✅ Sheet "Program" KEBACA, tapi KOSONG'); return; }
  var list = r.program.map(function(p,i) {
    return (i+1) + '. ' + (p.nama||'-') + ' | paket: ' + p.paket_tes + ' (' + typeof p.paket_tes + ')';
  }).join('\n');
  show('✅ Program ADA:\n\n' + list);
}

async function testSaveProgram() {
  var testData = [
    { id: 'TEST001', nama: 'Test Program A', kode: 'A', deskripsi: 'Test deskripsi A', paket_tes: 'GD,GD2PP,KOL', aktif: 'ya' },
    { id: 'TEST002', nama: 'Test Program B', kode: 'B', deskripsi: 'Test deskripsi B', paket_tes: 'DL,UR,GD', aktif: 'ya' }
  ];
  var r = await callAPI('saveMaster', { jenis: 'program', list: testData });
  if (!r) return;
  show('📤 Response saveMaster:\n\n' + JSON.stringify(r, null, 2));
}

async function testClearProgram() {
  if (!confirm('Hapus semua program?')) return;
  var r = await callAPI('saveMaster', { jenis: 'program', list: [] });
  if (!r) return;
  show('🗑️ Response clear:\n\n' + JSON.stringify(r, null, 2));
}
</script>
</body>
</html>
