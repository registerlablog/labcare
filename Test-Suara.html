<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tes Suara LabCare</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 20px; text-align: center; background: #f1f5f9; color: #1e293b; }
h1 { color: #0f172a; font-size: 24px; }
button { padding: 16px 32px; font-size: 16px; border-radius: 12px; border: none; background: #2563eb; color: #fff; font-weight: bold; margin: 8px; cursor: pointer; width: 100%; max-width: 320px; }
button:hover { background: #1d4ed8; }
.voice-list { background: #fff; padding: 16px; border-radius: 12px; margin-top: 24px; text-align: left; font-size: 13px; max-width: 500px; margin-left: auto; margin-right: auto; }
.voice-list p { margin: 4px 0; padding: 8px; border-bottom: 1px solid #e2e8f0; border-radius: 6px; }
.info { font-size: 12px; color: #64748b; margin-top: 20px; }
</style>
</head>
<body>
<h1>🔊 Tes Suara LabCare</h1>
<p>Klik tombol di bawah untuk tes suara</p>

<button onclick="tes1()">Tes 1: Suara Sederhana</button>
<button onclick="tes2()">Tes 2: Nomor Antrian</button>
<button onclick="tes3()">Tes 3: Paksa Bahasa Indonesia</button>
<button onclick="tes4()">Tes 4: Volume Maksimal</button>

<div class="voice-list" id="voiceList">
  <b>Memuat daftar suara...</b>
</div>

<div class="info">
  Jika tidak ada suara, cek:<br>
  1. Volume Media HP (bukan volume notifikasi)<br>
  2. Settings Android → Text-to-speech → Google TTS aktif<br>
  3. Coba pakai Chrome atau Edge
</div>

<script>
function tes1() {
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance('Halo, ini tes suara satu'));
}

function tes2() {
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance('Nomor antrian A satu, silakan menuju ruang sampling');
  u.lang = 'id-ID';
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

function tes3() {
  speechSynthesis.cancel();
  var voices = speechSynthesis.getVoices();
  var vID = voices.find(function(v) { return v.lang === 'id-ID' || v.lang.indexOf('id') === 0; });
  var u = new SpeechSynthesisUtterance('Nomor antrian A satu, silakan menuju ruang sampling');
  u.lang = 'id-ID';
  u.rate = 0.9;
  u.volume = 1;
  if (vID) {
    u.voice = vID;
    alert('Voice ditemukan:\n' + vID.name + '\nLang: ' + vID.lang);
  } else {
    alert('Tidak ada voice id-ID.\nPakai default browser.\n\nTotal voice: ' + voices.length);
  }
  speechSynthesis.speak(u);
}

function tes4() {
  speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance('Nomor antrian A satu, silakan menuju ruang sampling. Volume maksimal.');
  u.lang = 'id-ID';
  u.rate = 0.85;
  u.pitch = 1;
  u.volume = 1;
  speechSynthesis.speak(u);
}

function loadVoices() {
  var voices = speechSynthesis.getVoices();
  var div = document.getElementById('voiceList');
  if (voices.length === 0) {
    div.innerHTML = '<b>Suara Tersedia:</b><p>Tidak ada suara terdeteksi. Coba install Google TTS dari Play Store.</p>';
    return;
  }
  var html = '<b>Suara Tersedia (' + voices.length + '):</b>';
  var adaID = false;
  voices.forEach(function(v) {
    var isID = v.lang === 'id-ID' || v.lang.indexOf('id') === 0;
    if (isID) adaID = true;
    html += '<p style="' + (isID ? 'background:#dcfce7;font-weight:bold;' : '') + '">' + 
      (isID ? '🇮🇩 ' : '') + v.name + '<br><i style="font-size:11px;color:#64748b;">' + v.lang + '</i></p>';
  });
  if (!adaID) {
    html += '<p style="background:#fef3c7;color:#78350f;">⚠️ Tidak ada voice Bahasa Indonesia. Install Google TTS + Bahasa Indonesia di Settings Android.</p>';
  }
  div.innerHTML = html;
}

speechSynthesis.onvoiceschanged = loadVoices;
setTimeout(loadVoices, 500);
setTimeout(loadVoices, 2000);
</script>
</body>
</html>
