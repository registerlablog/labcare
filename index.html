<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabCare — Sistem Pelayanan Pasien Laboratorium</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --primary: #2563eb; --primary-dark: #1d4ed8; --primary-light: #eff6ff;
  --success: #16a34a; --success-light: #dcfce7;
  --warning: #f59e0b; --warning-light: #fef3c7;
  --purple: #9333ea; --purple-light: #f3e8ff;
  --danger: #dc2626;
  --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0;
  --slate-300: #cbd5e1; --slate-400: #94a3b8; --slate-500: #64748b;
  --slate-600: #475569; --slate-700: #334155; --slate-800: #1e293b;
  --slate-900: #0f172a;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(15,23,42,.08);
  --shadow-lg: 0 10px 25px -5px rgba(15,23,42,.15);
}
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--slate-100); color: var(--slate-800); line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
.layout { display: flex; min-height: 100vh; }
.sidebar { display: none; width: 240px; background: var(--slate-900); color: var(--slate-300); flex-direction: column; position: fixed; height: 100vh; z-index: 20; }
.sidebar-brand { padding: 20px; border-bottom: 1px solid var(--slate-700); }
.sidebar-brand h1 { color: #fff; font-size: 18px; font-weight: 700; }
.sidebar-brand p { font-size: 11px; color: var(--slate-400); margin-top: 2px; }
.sidebar-nav { flex: 1; padding: 12px; overflow-y: auto; }
.sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--slate-700); font-size: 11px; color: var(--slate-400); }
.sidebar-footer .reset-btn { display: block; margin-top: 8px; color: #f87171; background: none; border: none; cursor: pointer; font-size: 11px; font-family: inherit; padding: 0; width: 100%; text-align: left; }
.sidebar-footer .sync-btn { color: #4ade80; }
.nav-btn { display: block; width: 100%; text-align: left; padding: 10px 14px; border-radius: 8px; border: none; background: none; color: var(--slate-300); font-size: 14px; cursor: pointer; transition: .15s; font-family: inherit; margin-bottom: 4px; }
.nav-btn:hover { background: var(--slate-700); color: #fff; }
.nav-btn.active { background: var(--primary); color: #fff; font-weight: 600; }
.main-wrapper { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.mobile-header { display: flex; justify-content: space-between; align-items: center; background: var(--slate-900); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 30; }
.mobile-header h1 { font-size: 16px; font-weight: 700; }
.hamburger { background: none; border: none; color: #fff; font-size: 26px; line-height: 1; cursor: pointer; padding: 0 6px; }
.mobile-nav { display: none; background: var(--slate-800); padding: 8px; border-bottom: 1px solid var(--slate-700); }
.mobile-nav.open { display: block; }
.main { flex: 1; padding: 16px; }
@media (min-width: 768px) { .sidebar { display: flex; } .main-wrapper { margin-left: 240px; } .mobile-header { display: none; } .mobile-nav { display: none !important; } .main { padding: 24px; } }
.page-header { margin-bottom: 24px; }
.page-header h2 { font-size: 24px; font-weight: 700; color: var(--slate-900); }
.page-header p { font-size: 14px; color: var(--slate-500); margin-top: 4px; }
.page-header-flex { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
.page-header-flex h2 { font-size: 24px; font-weight: 700; color: var(--slate-900); }
.page-header-flex p { font-size: 14px; color: var(--slate-500); margin-top: 4px; }
.section-title { font-size: 15px; font-weight: 600; color: var(--slate-800); margin: 24px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--slate-200); }
.card { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.card + .card { margin-top: 16px; }
.stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 24px; }
@media (min-width: 768px) { .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
.stat-card { border-radius: var(--radius); padding: 20px; color: #fff; box-shadow: var(--shadow-lg); }
.stat-card .icon { font-size: 28px; margin-bottom: 6px; }
.stat-card .val { font-size: 30px; font-weight: 800; line-height: 1.1; }
.stat-card .lbl { font-size: 13px; opacity: .9; margin-top: 4px; }
.stat-blue   { background: linear-gradient(135deg, #3b82f6, #2563eb); }
.stat-amber  { background: linear-gradient(135deg, #f59e0b, #d97706); }
.stat-purple { background: linear-gradient(135deg, #a855f7, #9333ea); }
.stat-green  { background: linear-gradient(135deg, #22c55e, #16a34a); }
.table-wrap { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 500px; }
thead { background: var(--slate-50); color: var(--slate-500); text-align: left; }
th { padding: 12px 14px; font-weight: 600; font-size: 13px; }
td { padding: 12px 14px; border-top: 1px solid var(--slate-100); }
tbody tr:hover { background: var(--slate-50); }
.mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.badge-menunggu { background: var(--warning-light); color: #b45309; }
.badge-sampling { background: #dbeafe; color: #1d4ed8; }
.badge-proses   { background: var(--purple-light); color: #7e22ce; }
.badge-selesai  { background: var(--success-light); color: #15803d; }
.form-row { display: grid; gap: 16px; }
@media (min-width: 768px) { .form-row { grid-template-columns: 1fr 1fr; } }
.lbl { display: block; font-size: 12px; font-weight: 600; color: var(--slate-600); margin-bottom: 6px; }
.lbl .lbl-hint { font-weight: 400; color: var(--slate-400); font-size: 11px; }
.inp, .inp-sel, .inp-ta { width: 100%; padding: 10px 12px; border: 1px solid var(--slate-300); border-radius: 8px; font-size: 14px; font-family: inherit; color: var(--slate-800); background: #fff; outline: none; transition: .15s; }
.inp:focus, .inp-sel:focus, .inp-ta:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
.inp[readonly] { background: var(--slate-100); color: var(--slate-500); }
.inp-ta { resize: vertical; min-height: 60px; }
.info-box { display: flex; gap: 10px; align-items: flex-start; background: var(--warning-light); border-radius: 10px; padding: 12px 14px; font-size: 12px; color: #78350f; line-height: 1.5; margin-top: 8px; }
.info-box.info-blue { background: var(--primary-light); color: #1e3a8a; }
.info-box .info-em { font-size: 16px; flex-shrink: 0; }
.info-box a { color: inherit; font-weight: 700; cursor: pointer; text-decoration: underline; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: .15s; line-height: 1.4; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 10px rgba(37,99,235,.25); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--slate-200); color: var(--slate-700); }
.btn-secondary:hover { background: var(--slate-300); }
.btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; }
.btn-icon { padding: 6px 10px; font-size: 14px; border-radius: 8px; background: var(--slate-100); color: var(--slate-600); border: none; cursor: pointer; }
.btn-icon:hover { background: var(--slate-200); }
.btn-icon.danger { background: #fee2e2; color: var(--danger); }
.btn-icon.danger:hover { background: #fecaca; }
.btn-row { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.pill { padding: 7px 16px; border-radius: 999px; border: none; background: #fff; color: var(--slate-600); font-size: 13px; font-weight: 500; cursor: pointer; transition: .15s; font-family: inherit; }
.pill:hover { background: var(--slate-200); }
.pill.active { background: var(--primary); color: #fff; }
.pill .count { opacity: .7; margin-left: 2px; }
.patient-grid { display: grid; gap: 14px; }
@media (min-width: 768px) { .patient-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1200px) { .patient-grid { grid-template-columns: repeat(3, 1fr); } }
.patient-card { background: #fff; border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); border-left: 4px solid var(--slate-300); display: flex; flex-direction: column; }
.patient-card.menunggu { border-left-color: var(--warning); }
.patient-card.sampling { border-left-color: #3b82f6; }
.patient-card.proses   { border-left-color: var(--purple); }
.patient-card.selesai  { border-left-color: var(--success); }
.patient-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
.patient-card-head .antrian { font-size: 22px; font-weight: 800; font-family: ui-monospace, monospace; color: var(--slate-800); }
.patient-card-head .rm { font-size: 11px; color: var(--slate-400); font-family: ui-monospace, monospace; }
.patient-card h4 { font-size: 16px; font-weight: 600; color: var(--slate-800); }
.patient-card .meta { font-size: 12px; color: var(--slate-500); margin-top: 2px; }
.test-chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0; }
.test-chip { font-size: 10px; background: var(--slate-100); color: var(--slate-600); padding: 3px 8px; border-radius: 6px; }
.patient-card-actions { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--slate-100); margin-top: auto; }
.empty-state { background: #fff; border-radius: var(--radius); padding: 48px 24px; text-align: center; color: var(--slate-400); box-shadow: var(--shadow); }
.empty-state .em { font-size: 48px; display: block; margin-bottom: 12px; opacity: .4; }
.empty-state p { font-size: 14px; margin-bottom: 12px; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.6); z-index: 100; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(3px); }
.modal-overlay.open { display: flex; }
.modal { background: #fff; border-radius: 16px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,.25); animation: modalIn .25s cubic-bezier(.34,1.4,.64,1); }
@keyframes modalIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
.modal-body { padding: 24px; }
.modal-head { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 14px; border-bottom: 1px solid var(--slate-200); margin-bottom: 16px; }
.modal-head h3 { font-size: 17px; font-weight: 700; }
.modal-head p { font-size: 12px; color: var(--slate-500); margin-top: 2px; }
.modal-close { background: none; border: none; font-size: 28px; line-height: 1; color: var(--slate-400); cursor: pointer; padding: 0 4px; }
.result-list { display: flex; flex-direction: column; gap: 10px; max-height: 50vh; overflow-y: auto; padding-right: 4px; }
.result-item { display: grid; grid-template-columns: 1fr 100px 60px; gap: 10px; align-items: center; background: var(--slate-50); border-radius: 10px; padding: 12px; }
.result-item .ri-name { font-size: 14px; font-weight: 500; }
.result-item .ri-ref { font-size: 11px; color: var(--slate-400); margin-top: 2px; }
.result-item input { width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid var(--slate-300); border-radius: 8px; outline: none; font-family: inherit; }
.result-item .ri-unit { font-size: 12px; color: var(--slate-500); text-align: left; }
.modal-success { text-align: center; padding: 32px 24px; }
.modal-success .big-em { font-size: 56px; margin-bottom: 12px; }
.modal-success h3 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.modal-success p { font-size: 14px; color: var(--slate-500); margin-bottom: 16px; }
.success-number-box { background: var(--primary-light); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
.success-number-box p:first-child { font-size: 12px; color: var(--slate-500); }
.success-number-box .big-no { font-size: 40px; font-weight: 800; color: var(--primary); font-family: ui-monospace, monospace; margin-top: 4px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--slate-900); color: #fff; padding: 12px 22px; border-radius: 999px; font-size: 13px; font-weight: 600; z-index: 9999; opacity: 0; transition: all .3s cubic-bezier(.34,1.56,.64,1); box-shadow: 0 10px 25px rgba(0,0,0,.3); max-width: 90vw; text-align: center; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.err { background: var(--danger); }
.toast.ok { background: var(--success); }
.master-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.master-toolbar .search-box { flex: 1; min-width: 200px; max-width: 400px; position: relative; }
.master-toolbar .search-box input { width: 100%; padding: 10px 14px 10px 38px; border: 1px solid var(--slate-300); border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; transition: .15s; background: #fff; }
.master-toolbar .search-box::before { content: '🔍'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 14px; pointer-events: none; }
.pick-bar { display: grid; gap: 10px; margin-bottom: 14px; }
@media (min-width: 640px) { .pick-bar { grid-template-columns: 1fr 1fr; } }
.pick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.pick-chip-row { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; background: var(--primary-light); border-radius: 10px; margin-bottom: 12px; border: 1px solid #bfdbfe; min-height: 44px; align-items: center; }
.pick-chip-row .empty-text { font-size: 12px; color: #64748b; }
.pick-chip { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #bfdbfe; padding: 4px 8px 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--primary-dark); }
.pick-chip button { background: none; border: none; color: var(--slate-400); font-size: 14px; line-height: 1; cursor: pointer; padding: 0 2px; font-family: inherit; }
.pick-grid { display: grid; gap: 6px; max-height: 420px; overflow-y: auto; padding: 4px; border: 1px solid var(--slate-200); border-radius: 10px; background: var(--slate-50); }
@media (min-width: 768px) { .pick-grid { grid-template-columns: 1fr 1fr; } }
.pick-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; cursor: pointer; background: #fff; border: 1.5px solid transparent; transition: .12s; }
.pick-item:hover { border-color: var(--slate-300); }
.pick-item.picked { background: #eff6ff; border-color: var(--primary); }
.pick-item input { width: 18px; height: 18px; accent-color: var(--primary); flex-shrink: 0; cursor: pointer; }
.pick-item .pi-body { flex: 1; min-width: 0; }
.pick-item .pi-name { font-size: 13px; font-weight: 600; color: var(--slate-800); }
.pick-item .pi-detail { font-size: 10px; color: var(--slate-500); margin-top: 1px; }
.pick-item .pi-cat { font-size: 9px; text-transform: uppercase; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--slate-100); color: var(--slate-500); white-space: nowrap; flex-shrink: 0; }
.pick-empty { grid-column: 1 / -1; text-align: center; padding: 30px 16px; color: var(--slate-400); font-size: 13px; }
.sync-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; margin-top: 6px; }
.sync-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.sync-badge.online { background: rgba(74,222,128,.15); color: #4ade80; }
.sync-badge.offline { background: rgba(248,113,113,.15); color: #f87171; }
.sync-badge.syncing { background: rgba(96,165,250,.15); color: #60a5fa; }
.sync-badge.syncing .dot { animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
.fade-in { animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#printOverlay { display: none; position: fixed; inset: 0; z-index: 99999; background: #e2e8f0; overflow-y: auto; }
#printOverlay.open { display: block; }
.print-toolbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; background: #0f172a; color: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
.print-toolbar .print-title { font-size: 13px; font-weight: 600; flex: 1; text-align: center; }
.print-toolbar button { padding: 8px 14px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; }
.print-btn-print { background: #2563eb; color: #fff; }
.print-btn-cancel { background: rgba(255,255,255,.15); color: #fff; }
.print-page { max-width: 210mm; min-height: 297mm; margin: 16px auto; padding: 15mm; background: #fff; box-shadow: 0 4px 25px rgba(0,0,0,.15); font-family: Arial, Helvetica, sans-serif; font-size: 11px; line-height: 1.4; color: #1e293b; box-sizing: border-box; position: relative; overflow: hidden; }
@media print {
  @page { size: A4 portrait; margin: 0; }
  html, body { background: #fff !important; overflow: visible !important; }
  body > *:not(#printOverlay):not(#printArea) { display: none !important; }
  #printOverlay { display: block !important; position: static; background: #fff; overflow: visible; }
  #printOverlay .print-toolbar { display: none !important; }
  #printOverlay .print-page { box-shadow: none !important; margin: 0 !important; padding: 0 !important; width: 210mm !important; max-width: 210mm !important; min-height: 287mm !important; font-size: 10.5pt; position: relative !important; box-sizing: border-box !important; overflow: visible !important; }
  #printOverlay tr, #printOverlay .print-page div { page-break-inside: avoid; }
  #printOverlay .print-page { page-break-after: always; }
#printOverlay .print-page:last-child { page-break-after: auto; }
}
#panggilOverlay { display: none; position: fixed; inset: 0; background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); z-index: 99998; align-items: center; justify-content: center; flex-direction: column; color: #fff; padding: 40px 20px; text-align: center; }
#panggilOverlay.open { display: flex; }
#panggilOverlay .panggil-label { font-size: 22px; font-weight: 600; color: #94a3b8; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 20px; }
#panggilOverlay .panggil-no { font-size: 140px; font-weight: 900; font-family: ui-monospace, monospace; color: #fbbf24; letter-spacing: 8px; line-height: 1; text-shadow: 0 0 40px rgba(251,191,36,.6); }
#panggilOverlay .panggil-nama { font-size: 36px; font-weight: 700; margin-top: 30px; color: #fff; }
#panggilOverlay .panggil-close { position: absolute; top: 24px; right: 24px; background: rgba(255,255,255,.15); border: none; color: #fff; font-size: 32px; width: 56px; height: 56px; border-radius: 50%; cursor: pointer; font-family: inherit; }
#printArea { display: none; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h1>🧪 LabCare</h1>
      <p>Sistem Pelayanan Laboratorium</p>
      <span class="sync-badge" id="syncBadge"><span class="dot"></span><span id="syncBadgeText">Memuat...</span></span>
    </div>
    <nav class="sidebar-nav" id="nav"></nav>
    <div class="sidebar-footer">
      <p id="clock"></p>
      <button class="reset-btn sync-btn" onclick="manualSync()">🔄 Sinkron dari Spreadsheet</button>
      <button class="reset-btn" onclick="resetData()">🗑️ Reset data pasien</button>
    </div>
  </aside>
  <div class="main-wrapper">
    <header class="mobile-header">
      <h1>🧪 LabCare</h1>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="sync-badge" id="syncBadgeMobile" style="margin:0;"><span class="dot"></span></span>
        <button class="hamburger" onclick="toggleMobileNav()">☰</button>
      </div>
    </header>
    <nav class="mobile-nav" id="mobileNav"></nav>
    <main class="main"><div id="app"></div></main>
  </div>
</div>
<div class="modal-overlay" id="modal"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>
<div id="panggilOverlay">
  <button class="panggil-close" onclick="tutupPanggil()">&times;</button>
  <div class="panggil-label">Nomor Antrian</div>
  <div class="panggil-no" id="panggilNo">A-000</div>
  <div class="panggil-nama" id="panggilNama">—</div>
  <div class="panggil-ruang">Silakan menuju ruang sampling</div>
</div>
<div id="printArea"></div>
<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbzvDFJuyrswvUIsS7Jw-OxfQTjf_8AU4SGj9c5a_9UB8MSrE3dfxRERz7XllhlwIDT_/exec';

function fmtTglLahir(v) {

    '<button class="btn btn-secondary" onclick="closeModal()">Batal</button></div></div>';
  document.getElementById('modalContent').innerHTML = html;

function simpanHasilProlanis(kegId, idx) {
  var keg = (window._prolanisList || []).find(function(x) { return String(x.id_kegiatan) === String(kegId); });
  if (!keg) return;
  var p = (keg.peserta || [])[idx];
  if (!p) return;
  var cols = ['chol','trig','hdl','ldl','creatin','ureum','hba1c','mikro'];
  cols.forEach(function(c) {
    var el = document.getElementById('ph_' + c);
    if (el) {
      var v = el.value.trim();
      if (v) p[c] = v;
      else delete p[c];
    }
  });
  var kes = document.getElementById('pk_kesimpulan');
  p.kesimpulan = kes ? kes.value.trim() : '';
  window._prolanisList.forEach(function(k) { k.peserta_count = (k.peserta || []).length; });
  apiCall('saveMaster', { jenis: 'prolanis_kegiatan', list: window._prolanisList }).then(function() {
    var allPeserta = [];
    (window._prolanisList || []).forEach(function(k) {
      (k.peserta || []).forEach(function(ps, i) {
        var copy = JSON.parse(JSON.stringify(ps));
        copy.id = k.id_kegiatan + '-' + (i + 1);
        copy.id_kegiatan = k.id_kegiatan;
        copy.no = ps.no || ('P-' + String(i + 1).padStart(3, '0'));
        copy.status = 'selesai';
        copy.tgl_input = new Date().toISOString();
        allPeserta.push(copy);
      });
    });
    apiCall('saveMaster', { jenis: 'prolanis_peserta', list: allPeserta });
    toastMsg('✅ Hasil tersimpan', 'ok');
    closeModal();
    render();
  });
}

// --- Helper: normalisasi tanggal berbagai format ---
function normalizeDate(v) {
  if (!v) return '';
  v = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  var m1 = v.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/);
  if (m1) return m1[3] + '-' + m1[2].padStart(2, '0') + '-' + m1[1].padStart(2, '0');
  var m2 = v.match(/^(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})$/);
  if (m2) return m2[1] + '-' + m2[2].padStart(2, '0') + '-' + m2[3].padStart(2, '0');
  return v;
}

// --- Helper: matrix → array objek (auto-detect header + mapping kolom) ---
function matrixToProlanisObjects(matrix) {
  if (!matrix || matrix.length === 0) return [];
  var headerKeywords = ['nik','nama','tgl','lahir','alamat','chol','kolesterol','hdl','ldl'];
  var firstRow = matrix[0].map(function(c) { return String(c).toLowerCase().trim(); });
  var headerFound = headerKeywords.some(function(k) {
    return firstRow.some(function(c) { return c.indexOf(k) >= 0; });
  });
  var idxMap = {};
  var dataRows;
  if (headerFound) {
    firstRow.forEach(function(h, i) {
      var hl = h;
      if (hl.indexOf('nik') >= 0) idxMap.nik = i;
      else if (hl === 'nama' || hl.indexOf('nama ') === 0) idxMap.nama = i;
      else if (hl.indexOf('lahir') >= 0 || hl === 'tgl' || hl === 'tanggal lahir') idxMap.tgl_lahir = i;
      else if (hl.indexOf('alamat') >= 0) idxMap.alamat = i;
      else if (hl.indexOf('diagnosa') >= 0 || hl === 'dx' || hl === 'diag') idxMap.diagnosa = i;
      else if (hl.indexOf('chol') >= 0 || hl.indexOf('kolesterol') >= 0) idxMap.chol = i;
      else if (hl.indexOf('trig') >= 0) idxMap.trig = i;
      else if (hl === 'hdl') idxMap.hdl = i;
      else if (hl === 'ldl') idxMap.ldl = i;
      else if (hl.indexOf('crea') >= 0) idxMap.creatin = i;
      else if (hl.indexOf('ureum') >= 0 || hl.indexOf('urea') >= 0) idxMap.ureum = i;
      else if (hl.indexOf('hba1c') >= 0) idxMap.hba1c = i;
      else if (hl.indexOf('mikro') >= 0) idxMap.mikro = i;
    });
    dataRows = matrix.slice(1);
  } else {
    var order = ['nik','nama','tgl_lahir','alamat','chol','trig','hdl','ldl','creatin','ureum','hba1c','mikro'];
    order.forEach(function(k, i) { idxMap[k] = i; });
    dataRows = matrix;
  }
  var result = [];
  dataRows.forEach(function(row) {
    var obj = {};
    Object.keys(idxMap).forEach(function(k) {
      var v = row[idxMap[k]];
      if (v === undefined || v === null) v = '';
      v = String(v).trim();
      if (k === 'tgl_lahir') v = normalizeDate(v);
      obj[k] = v;
    });
    if (obj.nama || obj.nik) result.push(obj);
  });
  return result;
}

// --- Helper: parse text paste (auto-detect delimiter) ---
function parsePastedText(text) {
  var lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
  if (lines.length === 0) return [];
  var sample = lines[0];
  var tabCount = (sample.match(/\t/g) || []).length;
  var semiCount = (sample.match(/;/g) || []).length;
  var commaCount = (sample.match(/,/g) || []).length;
  var delim = '\t';
  if (tabCount === 0) delim = (semiCount >= commaCount) ? ';' : ',';
  var matrix = lines.map(function(l) { return l.split(delim).map(function(c) { return c.trim(); }); });
  return matrixToProlanisObjects(matrix);
}

function appendProlanisRows(rows) {
  if (!window._prolanisDetail || !rows || rows.length === 0) return 0;
  if (!window._prolanisDetail.peserta) window._prolanisDetail.peserta = [];
  var nextNum = parseInt(getNextProlanisNo(window._prolanisDetail).replace(/\D/g, ''), 10);
  var alamatKeg = window._prolanisDetail.alamat || '';
  var added = 0;
  rows.forEach(function(r) {
    window._prolanisDetail.peserta.push({
      no: 'P-' + String(nextNum + added).padStart(3, '0'),
      nik: r.nik || '',
      nama: r.nama || '',
      tgl_lahir: r.tgl_lahir || '',
      alamat: r.alamat || alamatKeg,
      diagnosa: r.diagnosa || '',
      chol: r.chol || '',
      trig: r.trig || '',
      hdl: r.hdl || '',
      ldl: r.ldl || '',

function handleUploadProlanis(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  if (typeof XLSX === 'undefined') { toastMsg('Library Excel belum siap', 'err'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, { type: 'array', cellDates: true });
      var ws = wb.Sheets[wb.SheetNames[0]];
      var matrix = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
      matrix = matrix.filter(function(row) { return row.some(function(c) { return String(c).trim() !== ''; }); });
      if (matrix.length === 0) { toastMsg('File kosong', 'err'); return; }
      var rows = matrixToProlanisObjects(matrix);
      if (rows.length === 0) { toastMsg('Tidak ada baris valid', 'err'); return; }
      window._uploadParsedRows = rows;
      renderProlanisPreview('uploadPreview', rows, 'konfirmasiUploadProlanis');
    } catch (err) {
      toastMsg('Gagal baca file: ' + err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

  if (!window._uploadParsedRows || window._uploadParsedRows.length === 0) {

  ws['!rows'] = [{ hpt: 32 }]; // Judul lebih tinggi
  
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Prolanis');
  
  // === 6. Nama file ===

function getTanggalKode(t) {
  if (!t) return '';
  var s = String(t);
  if (s.indexOf('T') > 0) s = s.split('T')[0];
  return s.replace(/[^0-9]/g, '');
}

  function hitungKalibrasi(kode) {
  var t = findTest(kode);
  if (!t || !t.kal_aktif) return;
  var rawEl = document.getElementById('raw_' + kode);
  var outEl = document.getElementById('h_' + kode);
  if (!rawEl || !outEl) return;
  var raw = parseFloat(rawEl.value);
  if (isNaN(raw)) { outEl.value = ''; return; }
  var faktor = parseFloat(t.kal_faktor) || 1;
  var result = raw;
  switch (t.kal_operator) {
    case '*': result = raw * faktor; break;
    case '/': result = faktor ? raw / faktor : raw; break;
    case '+': result = raw + faktor; break;
    case '-': result = raw - faktor; break;
  }
  result = Math.round(result * 100) / 100;
  outEl.value = result;
